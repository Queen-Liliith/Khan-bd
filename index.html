<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birthday Gacha Event! 🎉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle, #1a0b2e 0%, #05010d 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 15px;
        }

        /* Screens */
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            transition: opacity 0.5s ease;
        }
        .hidden {
            display: none !important;
            opacity: 0;
        }

        /* Screen 1: Welcome */
        #welcome-screen {
            text-align: center;
        }
        .banner {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.2) 0%, rgba(79, 70, 229, 0.2) 100%);
            border: 2px solid #a855f7;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            padding: 40px 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        .banner h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #f472b6, #c084fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .banner p {
            font-size: 1.1rem;
            color: #e2e8f0;
            line-height: 1.6;
        }
        .gacha-btn {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            border: none;
            color: white;
            padding: 18px 45px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .gacha-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.9);
        }

        /* Screen 2: Summon Animation */
        #summon-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 100;
            overflow: hidden;
        }
        .meteor-shower {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .meteor {
            position: absolute;
            width: 4px;
            height: 150px;
            background: linear-gradient(to bottom, rgba(234, 179, 8, 0), rgba(234, 179, 8, 1));
            animation: fall 1.2s linear infinite;
            opacity: 0;
            filter: drop-shadow(0 0 8px rgba(234, 179, 8, 0.8));
        }
        @keyframes fall {
            0% { 
                transform: translateY(-150px) translateX(150px) rotate(-30deg); 
                opacity: 0; 
            }
            15% {
                opacity: 1;
            }
            85% { 
                opacity: 1; 
            }
            100% { 
                transform: translateY(110vh) translateX(-110vh) rotate(-30deg); 
                opacity: 0; 
            }
        }

        /* Screen 3 & 4: Card Display & Final Screen */
        #card-screen {
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        #final-screen {
            max-width: 1200px;
            flex-direction: column;
            gap: 30px;
            width: 100%;
        }
        .pull-counter {
            font-size: 1.1rem;
            color: #fde047;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tip-text {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 5px;
            text-align: center;
        }

        /* Card 3D Flip */
        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 360px;
            height: 580px;
            max-height: 80vh;
            cursor: pointer;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card-container.flipped .card {
            transform: rotateY(180deg);
        }

        /* Card Sides */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            border: 3px solid;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Legendary S-Class Rarity Styles */
        .legendary {
            border-color: #eab308;
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.6);
            background: linear-gradient(180deg, #2d1a01 0%, #0f172a 100%);
        }

        .card-front-img-container {
            position: relative;
            width: 100%;
            height: 55%;
            border-bottom: 2px solid rgba(255,255,255,0.15);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        
        .card-bg-blur {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-size: cover;
            background-position: center;
            filter: blur(12px) brightness(0.5);
            z-index: 1;
            pointer-events: none;
        }

        .card-front-img {
            position: relative;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            padding: 10px;
            z-index: 2;
        }

        .card-info {
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            background: #0f172a;
            position: relative;
            z-index: 3;
        }
        .card-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .card-class {
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 8px;
            background-color: rgba(234, 179, 8, 0.2); 
            color: #fde047; 
            border: 1px solid #eab308;
        }
        .card-stat {
            font-size: 0.85rem;
            color: #4ade80; 
            font-weight: bold;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
            margin-bottom: 8px;
            white-space: pre-line;
        }

        .stars {
            color: #eab308;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        /* Back Side */
        .card-back {
            transform: rotateY(180deg);
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-back-title {
            font-size: 1.05rem;
            font-weight: bold;
            border-bottom: 1.5px solid rgba(255,255,255,0.15);
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fde047;
            flex-shrink: 0;
        }

        /* Текстовый контейнер */
        .card-wish {
            font-size: 1rem;
            line-height: 1.5;
            overflow-y: auto !important;
            flex-grow: 1;
            padding-right: 8px;
            text-align: left;
            white-space: pre-line;
            
            /* Решение проблемы со скроллом в 3D пространстве */
            transform: translateZ(0); 
            -webkit-transform: translateZ(0);
            -webkit-overflow-scrolling: touch !important; 
            pointer-events: auto !important;
            touch-action: pan-y !important; 
        }
        
        .card-footer-tip {
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 10px;
            text-transform: uppercase;
            flex-shrink: 0;
            letter-spacing: 1px;
        }

        /* Скроллбар */
        .card-wish::-webkit-scrollbar {
            width: 6px !important;
            display: block !important;
        }
        .card-wish::-webkit-scrollbar-thumb {
            background-color: rgba(254, 224, 71, 0.6) !important;
            border-radius: 4px;
        }
        .card-wish::-webkit-scrollbar-track {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Control Buttons */
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }

        /* Grid for Final Screen */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            padding: 10px;
        }
        #final-screen .card-container {
            height: 550px;
            max-height: 75vh;
            max-width: 100%;
        }

        @media (max-width: 600px) {
            .cards-grid {
                grid-template-columns: 1fr;
                max-width: 360px;
            }
            .card-container {
                height: 520px;
            }
            .card-wish {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div id="welcome-screen" class="screen">
        <div class="banner">
            <h1>Birthday Wish 2026</h1>
            <p>A unique festive event has started! You have 5 lucky wishes waiting. Summon your friends one by one!</p>
        </div>
        <button class="gacha-btn" onclick="triggerSummon()">PULL X1</button>
    </div>

    <div id="summon-screen" class="hidden">
        <div class="meteor-shower" id="shower"></div>
    </div>

    <div id="card-screen" class="screen hidden">
        <div class="pull-counter" id="pull-counter">Pulls remaining: 4/5</div>
        <div class="tip-text">Tap the card to reveal their secret wish!</div>
        
        <div class="card-container" id="card-container"></div>

        <div class="controls">
            <button class="gacha-btn" id="next-btn" onclick="triggerSummon()">Pull Next</button>
            <button class="gacha-btn hidden" id="show-all-btn" onclick="showFinalGrid()">Show All Heroes</button>
        </div>
    </div>

    <div id="final-screen" class="screen hidden">
        <h2 style="background: linear-gradient(to right, #f472b6, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2rem; text-align: center; margin-bottom: 10px;">Your Ultimate Party! 🎉</h2>
        <div class="tip-text">Tap on any S-Class hero to read their special birthday wishes again!</div>
        <div class="cards-grid" id="final-grid"></div>
    </div>

    <script>
        const players = [
            {
                name: "Yamahowlmoto Genryuusai",
                class: "Underground Head Captain of Soul Society",
                wish: `Hi there sweetie,
HAPPY BIRTHDAY ! 🎂🎉

I'm really really not good at writing essays about things like this.
but I hope you're blessed, wishing you the best and hope all your dreams come true in this age of yours.
Keep being sweet I like this side of yours, it's rare these days !

Also I hope you'll have more free time with us here and do things together like the old days 😉😊`,
                image: "https://i.pinimg.com/736x/5c/de/de/5cdedeb01ddda9670e18e1fd12e2e15f.jpg",
                rarity: "legendary"
            },
            {
                name: "Kabigon",
                class: "Best sleepyhead",
                wish: `Hi, sis 😁 I’m so happy to be celebrating your birthday!
We’ve been friends for several years now, and we’ve both become “sleepyheads,”
and I really admire your unwavering dedication.
I hope you win tickets to a BTS concert someday 😂, and I wish you all the best 😊😊😊
Happy birthday!`,
                image: "https://i.pinimg.com/736x/64/b9/95/64b995c86b77a74ca57e61da7301f252.jpg",
                rarity: "legendary"
            },
            {
                name: "Karoo",
                class: "Captain Speedy Duck",
                stat: "Escape speed +20%",
                wish: `Happy Birthday, Khan! 🎉🎂
Wishing you a fantastic birthday and an amazing year ahead! I hope this year brings you happiness, good health, and lots of great anime.
Thank you for always staying up late despite the time difference just to join us for the bear. You’re an awesome nakama, and I’m so glad we’ve shared so many adventures together.
Have an amazing birthday! 💖🎮✨🌸`,
                image: "https://i.pinimg.com/736x/f8/1b/29/f81b292e3d622f08792d09c838ff4f9a.jpg",
                rarity: "legendary"
            },
            {
                name: "Silly Goose",
                class: "Cozy Cat Whisperer",
                stat: `+1000% calming effect
+ ∞ sparkle power`,
                wish: `happy birthday sweet khan! my idea for your birthday party was that we all take a nap. i got overruled so i wish for you to have the best nap today and whenever you want them. i hope for many blessings for you in the coming year. love, athena 💖`,
                image: "https://i.pinimg.com/736x/71/83/7b/71837bc663dba16a6b13c0b36ec71c86.jpg",
                rarity: "legendary"
            },
            {
                name: "Lady (Mary)",
                class: "Your Safe Zone & Forever Friend",
                stat: `DMC Watch Progress: 15% 🤫 
Mood Restoration: MAX`,
                wish: `Happy Birthday! 🌌✨

Even if we are separated by dimensions, servers, or hundreds of kilometers, remember that for real connection, distance is just a glitch in the system

In this crazy world full of battles and daily quests, I want to be your safe zone. The place where you can just sit down, drink some virtual tea or wine, and rest 🍷

I wish you to stay as wonderful, sweet, and unique as you are. May your days be filled with warmth, cozy evenings, and let your luck today be absolutely broken (100% drop rate of joy!)

Thank you for your support. On your birthday, I wish you a stress-free life, many cozy days, and endless reasons to smile. May all your plans easily come true, and I will always be here to support you, listen, and cheer you up.

Happy Birthday! Sending you the warmest, tightest hugs ever! 🎂🧁🎈💖🎀✨🎁`,
                image: "https://i.pinimg.com/736x/03/e6/ac/03e6acf37d213312d6706557387ebc66.jpg",
                rarity: "legendary"
            }
        ];

        let currentPullIndex = 0;

        function triggerSummon() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('card-screen').classList.add('hidden');
            
            const summonScreen = document.getElementById('summon-screen');
            summonScreen.classList.remove('hidden');

            const shower = document.getElementById('shower');
            shower.innerHTML = ''; 

            const totalMeteors = 20;
            for (let i = 0; i < totalMeteors; i++) {
                setTimeout(() => {
                    const meteor = document.createElement('div');
                    meteor.className = 'meteor';
                    
                    const randomX = (Math.random() * 120) - 10; 
                    meteor.style.left = randomX + '%';
                    meteor.style.top = (Math.random() * -80) - 100 + 'px';
                    
                    const duration = 1.0 + Math.random() * 0.6;
                    meteor.style.animationDuration = duration + 's';
                    
                    shower.appendChild(meteor);
                }, i * 120);
            }

            setTimeout(() => {
                summonScreen.classList.add('hidden');
                displayCard();
            }, 3000);
        }

        // Обработчик прокрутки
        function enableTouchScroll(element) {
            let startY;
            
            element.addEventListener('touchstart', function(e) {
                startY = e.touches[0].pageY;
                e.stopPropagation();
            }, { passive: true });

            element.addEventListener('touchmove', function(e) {
                const moveY = e.touches[0].pageY;
                const deltaY = startY - moveY;
                
                element.scrollTop += deltaY;
                startY = moveY;
                
                e.stopPropagation();
                if (e.cancelable) e.preventDefault();
            }, { passive: false });
        }

        function displayCard() {
            const cardScreen = document.getElementById('card-screen');
            cardScreen.classList.remove('hidden');

            const counter = document.getElementById('pull-counter');
            const remaining = players.length - (currentPullIndex + 1);
            counter.innerText = `Pulls remaining: ${remaining}/5`;

            const container = document.getElementById('card-container');
            container.className = 'card-container'; 
            
            const player = players[currentPullIndex];
            const starsHtml = '⭐️⭐️⭐️⭐️⭐️';
            const statHtml = player.stat ? `<div class="card-stat">💨 ${player.stat}</div>` : '';

            container.innerHTML = `
                <div class="card ${player.rarity}">
                    <div class="card-front">
                        <div class="card-front-img-container">
                            <div class="card-bg-blur" style="background-image: url('${player.image}')"></div>
                            <img class="card-front-img" src="${player.image}" alt="${player.name}" onerror="this.src='https://placehold.co/300x300/eab308/ffffff?text=S-CLASS'">
                        </div>
                        <div class="card-info">
                            <div class="card-name">${player.name}</div>
                            <div class="card-class">${player.class}</div>
                            ${statHtml}
                            <div class="stars">${starsHtml}</div>
                        </div>
                    </div>
                    <div class="card-back">
                        <div class="card-back-title">Message from Hero</div>
                        <div class="card-wish" id="current-wish">${player.wish}</div>
                        <div class="card-footer-tip">Tap to flip back</div>
                    </div>
                </div>
            `;

            const wishElement = document.getElementById('current-wish');
            enableTouchScroll(wishElement);

            container.onclick = function(e) {
                if (e.target.closest('.card-wish')) {
                    return;
                }
                this.classList.toggle('flipped');
            };

            const nextBtn = document.getElementById('next-btn');
            const showAllBtn = document.getElementById('show-all-btn');
            
            if (currentPullIndex === players.length - 1) {
                nextBtn.classList.add('hidden');
                showAllBtn.classList.remove('hidden');
            } else {
                currentPullIndex++;
            }
        }

        function showFinalGrid() {
            document.getElementById('card-screen').classList.add('hidden');
            const finalScreen = document.getElementById('final-screen');
            finalScreen.classList.remove('hidden');

            const grid = document.getElementById('final-grid');
            grid.innerHTML = ''; 

            players.forEach((player, index) => {
                const cardContainer = document.createElement('div');
                cardContainer.className = 'card-container';
                
                const starsHtml = '⭐️⭐️⭐️⭐️⭐️';
                const statHtml = player.stat ? `<div class="card-stat">💨 ${player.stat}</div>` : '';
                const wishId = `wish-final-${index}`;

                cardContainer.innerHTML = `
                    <div class="card ${player.rarity}">
                        <div class="card-front">
                            <div class="card-front-img-container">
                                <div class="card-bg-blur" style="background-image: url('${player.image}')"></div>
                                <img class="card-front-img" src="${player.image}" alt="${player.name}" onerror="this.src='https://placehold.co/300x300/eab308/ffffff?text=S-CLASS'">
                            </div>
                            <div class="card-info">
                                <div class="card-name">${player.name}</div>
                                <div class="card-class">${player.class}</div>
                                ${statHtml}
                                <div class="stars">${starsHtml}</div>
                            </div>
                        </div>
                        <div class="card-back" style="pointer-events: auto;">
                            <div class="card-back-title">Message from Hero</div>
                            <div class="card-wish" id="${wishId}">${player.wish}</div>
                            <div class="card-footer-tip">Tap to flip back</div>
                        </div>
                    </div>
                `;

                grid.appendChild(cardContainer);

                const wishElement = document.getElementById(wishId);
                enableTouchScroll(wishElement);

                cardContainer.onclick = function(e) {
                    if (e.target.closest('.card-wish')) {
                        return;
                    }
                    this.classList.toggle('flipped');
                };
            });
        }
    </script>
</body>
</html>
