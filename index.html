<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Gacha Event! 🎉</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle, #1a0b2e 0%, #05010d 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 20px;
        }

        /* Screens */
        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            transition: opacity 0.5s ease;
        }
        .hidden {
            display: none !important;
            opacity: 0;
        }

        /* Screen 1: Welcome */
        #welcome-screen {
            text-align: center;
        }
        .banner {
            background: linear-gradient(135deg, rgba(147, 51, 234, 0.2) 0%, rgba(79, 70, 229, 0.2) 100%);
            border: 2px solid #a855f7;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            padding: 40px 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }
        .banner h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            background: linear-gradient(to right, #f472b6, #c084fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .banner p {
            font-size: 1.1rem;
            color: #e2e8f0;
            line-height: 1.6;
        }
        .gacha-btn {
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            border: none;
            color: white;
            padding: 18px 45px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .gacha-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.9);
        }

        /* Screen 2: Summon Animation */
        #summon-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .meteor-shower {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .meteor {
            position: absolute;
            width: 6px;
            height: 200px;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(234, 179, 8, 1));
            animation: fall 1.5s linear infinite;
            opacity: 0;
        }
        @keyframes fall {
            0% { transform: translateY(-200px) translateX(200px) rotate(-35deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100vh) translateX(-100vh) rotate(-35deg); opacity: 0; }
        }

        /* Screen 3 & 4: Card Display & Final Screen */
        #card-screen {
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }
        #final-screen {
            max-width: 1200px;
            flex-direction: column;
            gap: 30px;
            width: 100%;
        }
        .pull-counter {
            font-size: 1.1rem;
            color: #fde047;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tip-text {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 5px;
            text-align: center;
        }

        /* Card 3D Flip */
        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 310px;
            height: 450px;
            cursor: pointer;
        }
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card-container.flipped .card {
            transform: rotateY(180deg);
        }

        /* Card Sides */
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            border: 2px solid;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Legendary S-Class Rarity Styles */
        .legendary {
            border-color: #eab308;
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.5);
            background: linear-gradient(180deg, #2d1a01 0%, #0f172a 100%);
        }

        /* Front Side */
        .card-front-img {
            width: 100%;
            height: 60%;
            object-fit: cover;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .card-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
        }
        .card-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .card-class {
            font-size: 0.9rem;
            text-transform: uppercase;
            padding: 4px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            background-color: rgba(234, 179, 8, 0.2); 
            color: #fde047; 
            border: 1px solid #eab308;
        }

        .stars {
            color: #eab308;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        /* Back Side */
        .card-back {
            transform: rotateY(180deg);
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-back-title {
            font-size: 1rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fde047;
        }

        .card-wish {
            font-size: 1rem;
            line-height: 1.6;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
            text-align: left;
            white-space: pre-line;
        }
        .card-footer-tip {
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .card-wish::-webkit-scrollbar {
            width: 4px;
        }
        .card-wish::-webkit-scrollbar-thumb {
            background-color: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        /* Control Buttons */
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
        }

        /* Grid for Final Screen */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            width: 100%;
            padding: 10px;
        }
        /* Adjusted height for grid view to keep it compact */
        #final-screen .card-container {
            height: 400px;
            max-width: 100%;
        }
        #final-screen .card-name {
            font-size: 1.2rem;
        }
        #final-screen .card-class {
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .cards-grid {
                grid-template-columns: 1fr;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: Welcome -->
    <div id="welcome-screen" class="screen">
        <div class="banner">
            <h1>Birthday Wish 2026</h1>
            <p>A unique festive event has started! You have 5 lucky wishes waiting. Summon your friends one by one!</p>
        </div>
        <button class="gacha-btn" onclick="triggerSummon()">PULL X1</button>
    </div>

    <!-- SCREEN 2: Summon Animation -->
    <div id="summon-screen" class="screen hidden">
        <div class="meteor-shower" id="shower"></div>
    </div>

    <!-- SCREEN 3: Single Card Display -->
    <div id="card-screen" class="screen hidden">
        <div class="pull-counter" id="pull-counter">Pulls remaining: 4/5</div>
        <div class="tip-text">Tap the card to reveal their secret wish!</div>
        
        <div class="card-container" id="card-container">
            <!-- Card is dynamically injected here -->
        </div>

        <div class="controls">
            <button class="gacha-btn" id="next-btn" onclick="triggerSummon()">Pull Next</button>
            <button class="gacha-btn hidden" id="show-all-btn" onclick="showFinalGrid()">Show All Heroes</button>
        </div>
    </div>

    <!-- SCREEN 4: Final Full Grid (Reveals in the end) -->
    <div id="final-screen" class="screen hidden">
        <h2 style="background: linear-gradient(to right, #f472b6, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2rem; text-align: center;">Your Ultimate Party! 🎉</h2>
        <div class="tip-text">Tap on any S-Class hero to read their special birthday wishes again!</div>
        <div class="cards-grid" id="final-grid">
            <!-- All 5 cards will be injected here -->
        </div>
    </div>

    <script>
        // PLAYERS DATA - Change values and paste direct postimages links here!
        const players = [
            {
                name: "Blizzard",
                class: "Mage-Sorcerer (S-Class)",
                wish: "Happy Birthday! 🥳 I hope your new year of life is filled with epic loot, critical hits in everything you do, and endless mana! Thank you for being such an awesome friend. Let's make some more amazing gaming memories together!",
                image: "PASTE_BLIZZARDS_IMAGE_URL_HERE",
                rarity: "legendary"
            },
            {
                name: "Friend 2",
                class: "Samurai / Swordsman (S-Class)",
                wish: "Happy Birthday! Wishing you all the happiness, warmth, and legendary moments in the world!",
                image: "PASTE_FRIEND_2_IMAGE_URL_HERE",
                rarity: "legendary"
            },
            {
                name: "Friend 3",
                class: "Necromancer (S-Class)",
                wish: "Happy Birthday! May your day be as amazing and wonderful as you are. Enjoy your special holiday!",
                image: "PASTE_FRIEND_3_IMAGE_URL_HERE",
                rarity: "legendary"
            },
            {
                name: "Friend 4",
                class: "Cute Mascot (S-Class)",
                wish: "Have a blast today! Sending you lots of love and best wishes. Happy Birthday!",
                image: "PASTE_FRIEND_4_IMAGE_URL_HERE",
                rarity: "legendary"
            },
            {
                name: "Friend 5",
                class: "Guild Leader (S-Class)",
                wish: "Happy Birthday, our dearest friend! You are the absolute star of our guild. Never stop shining! We are so lucky to have you.",
                image: "PASTE_FRIEND_5_IMAGE_URL_HERE",
                rarity: "legendary"
            }
        ];

        let currentPullIndex = 0;

        function triggerSummon() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('card-screen').classList.add('hidden');
            
            const summonScreen = document.getElementById('summon-screen');
            summonScreen.classList.remove('hidden');

            const shower = document.getElementById('shower');
            shower.innerHTML = ''; // Reset meteors

            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const meteor = document.createElement('div');
                    meteor.className = 'meteor';
                    meteor.style.left = Math.random() * 100 + '%';
                    meteor.style.top = Math.random() * -50 + 'px';
                    meteor.style.animationDelay = Math.random() * 0.5 + 's';
                    shower.appendChild(meteor);
                }, i * 150);
            }

            setTimeout(() => {
                summonScreen.classList.add('hidden');
                displayCard();
            }, 3000);
        }

        function displayCard() {
            const cardScreen = document.getElementById('card-screen');
            cardScreen.classList.remove('hidden');

            const counter = document.getElementById('pull-counter');
            const remaining = players.length - (currentPullIndex + 1);
            counter.innerText = `Pulls remaining: ${remaining}/5`;

            const container = document.getElementById('card-container');
            container.className = 'card-container'; // Reset flip
            
            const player = players[currentPullIndex];
            const starsHtml = '⭐️⭐️⭐️⭐️⭐️';

            container.innerHTML = `
                <div class="card ${player.rarity}">
                    <div class="card-front">
                        <img class="card-front-img" src="${player.image}" alt="${player.name}" onerror="this.src='https://placehold.co/300x300/eab308/ffffff?text=S-CLASS'">
                        <div class="card-info">
                            <div class="card-name">${player.name}</div>
                            <div class="card-class">${player.class}</div>
                            <div class="stars">${starsHtml}</div>
                        </div>
                    </div>
                    <div class="card-back">
                        <div class="card-back-title">Message from Hero</div>
                        <div class="card-wish">${player.wish}</div>
                        <div class="card-footer-tip">Tap to flip back</div>
                    </div>
                </div>
            `;

            container.onclick = function() {
                this.classList.toggle('flipped');
            };

            const nextBtn = document.getElementById('next-btn');
            const showAllBtn = document.getElementById('show-all-btn');
            
            if (currentPullIndex === players.length - 1) {
                nextBtn.classList.add('hidden');
                showAllBtn.classList.remove('hidden');
            } else {
                currentPullIndex++;
            }
        }

        function showFinalGrid() {
            document.getElementById('card-screen').classList.add('hidden');
            const finalScreen = document.getElementById('final-screen');
            finalScreen.classList.remove('hidden');

            const grid = document.getElementById('final-grid');
            grid.innerHTML = ''; // Clear prior content

            players.forEach((player) => {
                const cardContainer = document.createElement('div');
                cardContainer.className = 'card-container';
                
                cardContainer.onclick = function() {
                    this.classList.toggle('flipped');
                };

                const starsHtml = '⭐️⭐️⭐️⭐️⭐️';

                cardContainer.innerHTML = `
                    <div class="card ${player.rarity}">
                        <div class="card-front">
                            <img class="card-front-img" src="${player.image}" alt="${player.name}" onerror="this.src='https://placehold.co/300x300/eab308/ffffff?text=S-CLASS'">
                            <div class="card-info">
                                <div class="card-name">${player.name}</div>
                                <div class="card-class">${player.class}</div>
                                <div class="stars">${starsHtml}</div>
                            </div>
                        </div>
                        <div class="card-back">
                            <div class="card-back-title">Message from Hero</div>
                            <div class="card-wish">${player.wish}</div>
                            <div class="card-footer-tip">Tap to flip back</div>
                        </div>
                    </div>
                `;
                grid.appendChild(cardContainer);
            });
        }
    </script>
</body>
</html>
